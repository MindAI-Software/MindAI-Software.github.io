<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MindAI Software - Empowering Intelligence through Innovative Code. We build accessible, high-performance software that bridges human creativity and AI.">
  <meta name="theme-color" content="#ff9800" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <title>MindAI Software</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <style>
    :root { color-scheme: light dark; }
    ::selection { background: #ff9800; color: #1a1a1a; }
    header ::selection { background: #1a1a1a; color: #ff9800; }
    body { font-family: system-ui, sans-serif; color: #333; margin: 0; text-align: center; opacity: 0; animation: f 1s forwards; line-height: 1.6; }
    h1, h2 { text-wrap: balance; }
    p { text-wrap: pretty; }
    @keyframes f { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      body { animation: none; opacity: 1; }
    }
    header { background: #ff9800; color: #1a1a1a; padding: 3rem 1rem; }
    main { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1a1a1a;
      color: white;
      padding: 0.8rem 1.5rem;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 1rem;
      transition: transform 0.1s ease, outline 0.2s ease;
    }
    .cta:hover { background-color: #333; }
    .cta:focus-visible { outline: 3px solid #1a1a1a; outline-offset: 2px; }
    .cta:active { transform: scale(0.96); }
    .skip-link {
      position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
      background: #1a1a1a; color: white; padding: 0.6rem 1.2rem;
      text-decoration: none; border-radius: 0 0 6px 6px; font-weight: bold;
      z-index: 100; transition: top 0.2s; border: 2px solid #ff9800; border-top: none;
    }
    .skip-link:focus-visible { top: 0; outline: 3px solid #1a1a1a; outline-offset: 2px; }
    footer { margin-top: 2rem; color: #4b4b4b; font-size: 0.9rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #e0e0e0; }
      footer { color: #a0a0a0; }
      .cta { background: #ff9800; color: #1a1a1a; }
      .cta:hover { background-color: #ffa726; }
      .cta:focus-visible { outline-color: #ff9800; }
    }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  <header>
    <h1>MindAI Software</h1>
    <p>Empowering Intelligence through Innovative Code</p>
  </header>
  <main id="main" tabindex="-1">
    <section aria-labelledby="h">
      <h2 id="h">Delightful AI Solutions</h2>
      <p>We build accessible, high-performance software that bridges human creativity and AI.</p>
      <a href="https://github.com/MindAI-Software" class="cta" aria-label="Explore GitHub projects on our profile">
        <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        Explore GitHub
      </a>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 MindAI Software</p>
  </footer>
</body>
</html>
